<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="godmars 的个人博客">
    <meta name="theme-color" content="#256d85">
    <meta property="og:type" content="website">
    <meta property="og:title" content="godmars' Blog">
    <meta property="og:description" content="godmars 的个人博客">
    <meta property="og:url" content="https://gammars.github.io/">
    <link rel="canonical" href="https://gammars.github.io/">
    <link rel="icon" href="assets/avatar.png">
    <title>godmars' Blog</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/styles.css?v=20260908-1">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" data-view="home" aria-label="返回首页">godmars' Blog</a>
      <nav class="nav" aria-label="主导航">
        <a href="#home" data-view="home">首页</a>
        <a href="#about" data-view="about">关于</a>
        <a href="#archive" data-view="archive">归档</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深色模式" title="切换深色模式">
        <span aria-hidden="true">◐</span>
      </button>
    </header>

    <main class="shell">
      <aside class="profile-panel" aria-label="个人信息">
        <div class="profile-card">
          <img class="profile-cover" src="assets/profile-card.png" alt="博客封面图">
          <img class="avatar" src="assets/avatar.png" alt="godmars 的头像">
          <h1 id="profileName">godmars</h1>
          <p id="profileBio">待补充</p>
          <dl class="stats" aria-label="站点概览">
            <div>
              <dt id="postCount">0</dt>
              <dd>日志</dd>
            </div>
            <div>
              <dt id="categoryCount">0</dt>
              <dd>分类</dd>
            </div>
            <div>
              <dt id="tagCount">0</dt>
              <dd>标签</dd>
            </div>
          </dl>
          <div class="links">
            <a href="https://github.com/gammars" target="_blank" rel="noreferrer">GitHub</a>
            <a href="mailto:811096909@qq.com">Email</a>
          </div>
        </div>

        <section class="side-section">
          <h2>搜索</h2>
          <label class="search-box">
            <span class="sr-only">搜索文章</span>
            <input id="searchInput" type="search" placeholder="搜索标题、标签、内容">
          </label>
        </section>

        <section class="side-section">
          <h2>链接</h2>
          <ul class="plain-list">
            <li><a href="https://pages.github.com/" target="_blank" rel="noreferrer">GitHub Pages</a></li>
            <li><a href="https://hexo.io/" target="_blank" rel="noreferrer">Hexo</a></li>
          </ul>
        </section>
      </aside>

      <section class="content-panel">
        <details class="discovery-drawer">
          <summary>
            <span>浏览分类与标签</span>
            <span class="discovery-drawer-summary" data-discovery-summary></span>
          </summary>
          <div class="discovery-drawer-body">
            <section class="discovery-section" aria-labelledby="mobileCategoryHeading">
              <div class="discovery-heading">
                <h2 id="mobileCategoryHeading">分类目录</h2>
                <span data-category-total></span>
              </div>
              <div class="discovery-list" data-category-cards></div>
            </section>
            <section class="discovery-section" aria-labelledby="mobileTagHeading">
              <div class="discovery-heading">
                <h2 id="mobileTagHeading">标签</h2>
                <span data-tag-total></span>
              </div>
              <div class="tag-cloud" data-tag-cards></div>
            </section>
          </div>
        </details>
        <div id="viewHeader" class="view-header"></div>
        <div id="app"></div>
      </section>
      <aside class="discovery-panel" aria-label="分类与标签">
        <section class="discovery-card">
          <div class="discovery-heading">
            <h2>分类目录</h2>
            <span data-category-total></span>
          </div>
          <div class="discovery-list" data-category-cards></div>
        </section>
        <section class="discovery-card">
          <div class="discovery-heading">
            <h2>标签</h2>
            <span data-tag-total></span>
          </div>
          <div class="tag-cloud" data-tag-cards></div>
        </section>
      </aside>
      <aside class="toc-panel" aria-label="文章目录">
        <nav id="toc" class="toc-nav"></nav>
      </aside>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> godmars</span>
      <span>Built for GitHub Pages</span>
    </footer>

    <noscript>此博客需要启用 JavaScript 才能浏览文章。</noscript>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script src="assets/posts.js"></script>
    <script src="assets/about.js"></script>
    <script src="assets/app.js?v=20260829-1"></script>
  </body>
</html>
